<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Bhanu Prasad Golla</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--paper:#faf9f6;--ink:#16181c;--ink-2:#3d4149;--ink-3:#71757e;--rule:#e2dfd7;--accent:#9a3b1f;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100svh;
  display:grid;place-items:center;padding:32px;line-height:1.65;-webkit-font-smoothing:antialiased}
.box{max-width:52ch;text-align:center}
.code{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink-3);
  border:1px solid var(--rule);padding:6px 15px;border-radius:999px;display:inline-block;margin-bottom:26px;background:#fff}
h1{font-family:var(--serif);font-size:clamp(2rem,6vw,3.2rem);font-weight:300;letter-spacing:-.035em;
  line-height:1.05;margin-bottom:18px}
h1 em{font-style:italic;color:var(--accent)}
p{color:var(--ink-2);font-weight:300;margin-bottom:30px}
a.btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);
  padding:13px 26px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;transition:.3s}
a.btn:hover{background:var(--accent);transform:translateY(-2px)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <main class="box">
    <span class="code">ERROR 404</span>
    <h1>That page took an <em>unexpected branch.</em></h1>
    <p>The address you followed doesn't exist on this site. Every deviation deserves a root cause, but this one is probably just a stale link.</p>
    <a class="btn" href="/">Back to the portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
